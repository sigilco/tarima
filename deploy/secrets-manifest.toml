# Secrets contract for the VPS. Names only, never values: values live in
# Infisical (project 76492067-b7c2-4a47-9b2d-f87ef68b1a8e, env dev) and are
# rendered by deploy/scripts/render_secrets.py.
#
# Infisical folders this manifest reads (create any that do not exist yet,
# env dev):
#   /email       Brevo sender credentials
#   /ai          the OpenAI compatible LLM endpoint
#   /infra/litestream   R2 replication credentials
#   /beta        the tester allowlist and the session signing secret
#   /webhooks    the shared secret the Cloudflare email worker presents
#   /channels    Telegram and WhatsApp Cloud API credentials
#
# Rules (enforced by validate_secrets_manifest.py):
# - every key listed must exist and be non-empty in its Infisical folder or
#   the render fails before anything is written
# - files are rendered whole (replace, never merge) with mode 0600
# - static = { KEY = "value" } holds non-secret settings only

version = 1

unrendered_keys = []

[key_sets]
app = ["BREVO_API_KEY", "MAIL_FROM"]
ai = ["LLM_BASE_URL", "LLM_API_KEY", "LLM_INSTRUCT_MODEL_ID", "LLM_THINKING_MODEL_ID"]
litestream = ["S3_ACCESS_KEY", "S3_SECRET_KEY"]
beta = ["BETA_ALLOWLIST", "SESSION_SECRET"]
webhooks = ["INBOUND_WEBHOOK_SECRET"]
channels = [
  "TELEGRAM_BOT_TOKEN",
  "WHATSAPP_TOKEN",
  "WHATSAPP_PHONE_NUMBER_ID",
  "WHATSAPP_APP_SECRET",
  "WHATSAPP_VERIFY_TOKEN",
]
[[files]]
id = "app"
host_file = "/opt/tarima2/shared/app.env"
owner = "web-services"
group = "web-services"
mode = "0600"
infisical_env = "dev"
sources = [
  { path = "/email", keys = "app" },
  { path = "/ai", keys = "ai" },
  { path = "/beta", keys = "beta" },
  { path = "/webhooks", keys = "webhooks" },
  { path = "/channels", keys = "channels" },
]
units = ["tarima.service"]
# DATABASE_URL and PORT are deployment facts, not Infisical values.
# EMAIL_LOOPBACK_DOMAINS is the comma separated list of domains whose mail
# is captured in the loopback_inbox table instead of being sent. It keeps
# the api default (tarima.test) so a tester on a loopback domain never
# sends real mail; a real domain is never listed, so production mail
# always goes out through Brevo.
static = { DATABASE_URL = "/opt/tarima2/shared/data/tarima.db", PORT = "3001", EMAIL_LOOPBACK_DOMAINS = "tarima.test", TELEGRAM_API_BASE = "https://api.telegram.org" }

[[files]]
id = "litestream"
host_file = "/opt/tarima2/shared/litestream.env"
owner = "web-services"
group = "web-services"
mode = "0600"
infisical_env = "dev"
sources = [{ path = "/infra/litestream", keys = "litestream" }]
units = ["tarima-litestream.service"]
# Never point at a bucket with an R2 lifecycle delete rule.
static = { S3_BUCKET = "tarima-backups", S3_PATH = "litestream/", S3_REGION = "auto", S3_ENDPOINT = "https://ea4dcf9f4d3179bfead02c492d8f59e3.r2.cloudflarestorage.com" }
