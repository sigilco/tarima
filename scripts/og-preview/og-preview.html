<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tarima og preview</title>
    <style>
      /* The og card is a static render of the playful landing: the same
         type stack (Geist), the same paper background, the same yellow
         marker highlight and the same scribble underline. 1200x630 is the
         Open Graph safe size.

         Readability rule: og cards render as ~400px thumbnails in feeds,
         so everything on the card must survive a 3x shrink. That means
         one huge headline, one short line, no UI screenshots. The phone
         mockup from the landing is deliberately left off: its 13px
         bubbles are illegible at thumbnail size. */
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 100 900;
        src: url("geist-latin-wght-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Geist";
        font-style: italic;
        font-weight: 100 900;
        src: url("geist-latin-wght-italic.woff2") format("woff2");
      }

      :root {
        --paper: #fafafa;
        --ink: #171717;
        --ink-2: #525252;
        --ink-3: #a3a3a3;
        --line: rgba(23, 23, 23, 0.09);
        --marker: #facc15;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1200px;
        height: 630px;
        background: var(--paper);
        color: var(--ink);
        font-family: "Geist", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 48px 72px 42px;
        display: flex;
        flex-direction: column;
      }

      /* --- brand row --- */

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .brand img {
        width: 44px;
        height: 44px;
        border-radius: 11px;
      }

      .brand .name {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      /* --- headline --- */

      .headline {
        margin-top: 40px;
        font-size: 100px;
        line-height: 1.03;
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      .headline .line {
        display: block;
        white-space: nowrap;
      }

      /* The marker highlight: a yellow block behind the words, the same
         beat as MarkerHighlight.tsx on the landing. */
      .marker {
        background: var(--marker);
        padding: 0 0.1em 0.02em;
        margin-right: 0.05em;
        box-decoration-break: clone;
        -webkit-box-decoration-break: clone;
      }

      /* The scribble underline: the same hand-drawn stroke as
         ScribbleUnderline.tsx, scaled up. */
      .scribble {
        position: relative;
        display: inline-block;
      }

      .scribble svg {
        position: absolute;
        left: 0;
        bottom: -0.06em;
        width: 100%;
        height: 0.16em;
        overflow: visible;
      }

      /* --- the one short line --- */

      .sub {
        margin-top: 34px;
        margin-bottom: 26px;
        font-size: 38px;
        line-height: 1.3;
        font-weight: 500;
        letter-spacing: -0.02em;
        color: var(--ink-2);
        max-width: 1000px;
      }

      .sub .wave {
        position: relative;
        display: inline-block;
        color: var(--ink);
        font-weight: 700;
      }

      .sub .wave svg {
        position: absolute;
        left: 0;
        bottom: -0.14em;
        width: 100%;
        height: 0.11em;
        overflow: visible;
      }

      /* --- footer --- */

      .footer {
        margin-top: auto;
        border-top: 1px solid var(--line);
        padding-top: 24px;
        display: flex;
        align-items: center;
        gap: 22px;
        font-size: 26px;
        color: var(--ink-3);
        letter-spacing: -0.01em;
      }

      .footer .rating {
        font-weight: 700;
        color: var(--ink);
      }

      .footer .rule {
        width: 1px;
        height: 26px;
        background: #d4d4d4;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <img src="mark.png" alt="" />
        <span class="name">Tarima</span>
      </div>

      <h1 class="headline">
        <span class="line">Your event's</span>
        <span class="line"><span class="marker">ops agent</span>is now</span>
        <span class="line">
          <span class="scribble"
            >on your phone
            <svg viewBox="0 0 320 14" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M3 9.5C65 5 185 3.5 316 8.5C260 11.5 130 11.5 50 11.5"
                stroke="#FACC15"
                stroke-width="4.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
        </span>
      </h1>

      <p class="sub">
        Brief it once. It chases every vendor
        <span class="wave"
          >for you
          <svg viewBox="0 0 200 12" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M2 8C45 4 120 3 198 7C150 9.5 70 9.5 30 9.5"
              stroke="#FACC15"
              stroke-width="4"
              stroke-linecap="round"
            />
          </svg>
        </span>
        .
      </p>

      <div class="footer">
        <span class="rating">Early access</span>
        <span class="rule"></span>
        <span>Free while we onboard a few organizers each week</span>
      </div>
    </div>
  </body>
</html>
