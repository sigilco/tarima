# Continuous integration for the tarima workspace.
#
# Jobs:
#
#   validate   the full static and unit gate (`mise run validate`)
#   smoke      builds the web bundle + eve runtime, then boots the
#              preview with the deterministic stub LLM and the channel
#              mocks and asserts the wire paths a browser uses
#              (`mise run verify:smoke`)
#
# The browser suite (Playwright) is not run per-push: it needs the
# browser binaries and is the laptop gate. It runs nightly and on
# demand with `mise run test:e2e`.
name: ci

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - ".agents/**"
      - "research/**"
      - "**.md"
  push:
    branches:
      - main
      - "beta/**"
      - "work/**"
    paths-ignore:
      - "docs/**"
      - ".agents/**"
      - "research/**"
      - "**.md"
  schedule:
    # Nightly browser e2e (UTC).
    - cron: "0 3 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: validate
        run: pnpm validate

  smoke:
    name: smoke (preview boot + wire paths)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: build the web bundle and the eve runtime
        run: pnpm build

      - name: smoke
        run: node scripts/smoke.ts

  e2e:
    name: e2e (playwright, nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: install playwright browsers
        run: pnpm --filter web exec playwright install --with-deps

      - name: browser e2e
        run: pnpm --filter web test:e2e
