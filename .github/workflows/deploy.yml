# Deploy tarima to the VPS.
#
# Shape (mirrors brioso's deploy.yml):
#
#   build    builds the artifact on the runner and packs it
#   deploy   joins the tailnet, ships the artifact over SSH, and runs
#            exactly one sudoers-allowed script on the box:
#            sudo /usr/local/sbin/tarima-deploy '<sha>'
#
# The sudoers entry is the trust boundary: CI cannot get a general shell
# on the VPS. The script is root-owned and lives outside the repo
# checkout, so CI cannot edit the thing it sudo-runs. It keeps the
# previous release, so a rollback is one symlink flip on the box.
#
# Secrets (GitHub environment "production"):
#   TS_OAUTH_CLIENT_ID   tailnet OAuth client, tagged tag:ci
#   TS_OAUTH_SECRET      tailnet OAuth secret, tagged tag:ci
#   VPS_TAILSCALE_HOST   MagicDNS name of the VPS (ovhcloud.tail876c20.ts.net)
#   VPS_DEPLOY_SSH_KEY   ed25519 private key whose public half is in
#                        /home/deploy/.ssh/authorized_keys on the box
name: deploy

on:
  push:
    branches:
      - main
    # Set the repo variable DEPLOY_ENABLED=true (repo Settings, Actions,
    # Variables) once the production secrets exist. Until then the
    # workflow skips instead of going red on every push.
  workflow_dispatch:
    inputs:
      ref:
        description: "ref to deploy (default: the pushed sha)"
        required: false
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: build artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: vars.DEPLOY_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The artifact is what the systemd unit execs. A build that did not
      # produce it must stop here, not break the service on the VPS.
      - name: verify the artifact
        run: |
          test -f apps/api/dist/server/index.mjs
          test -d apps/api/dist/server/web/ssr
          test -d apps/api/dist/server/web/client
      # The bundle keeps third-party packages external (the native sqlite
      # binding is real), so the runtime node_modules ship WITH the
      # artifact: pnpm deploy produces a self-contained, catalog-resolved
      # tree that installs on the box with no network and no workspace.
      # A runtime dependency added in source is therefore present by
      # construction; a missing dep can never crash-loop the service.
      - name: assemble the deployable package
        run: |
          pnpm deploy /tmp/tarima-pkg --filter @tarima/api --prod --legacy
          test -f /tmp/tarima-pkg/package.json
          test -d /tmp/tarima-pkg/node_modules
          node -e "require('/tmp/tarima-pkg/node_modules/better-sqlite3')(':memory:')" \
            && echo "native binding ok"
      # Boot smoke: import the real bundle against the shipped
      # node_modules. A dependency the bundle needs but the prod install
      # does not carry (bcryptjs was a devDependency used at runtime)
      # fails here, on the runner, instead of crash-looping the service.
      # The import starts a listener, so the process is exited explicitly
      # once the module graph has resolved.
      - name: boot smoke the artifact
        run: |
          node --input-type=module -e "
            process.env.DATABASE_URL = ':memory:';
            process.env.SESSION_SECRET = 'smoke';
            try {
              await import('file:///tmp/tarima-pkg/dist/server/index.mjs');
              console.log('boot smoke: module graph ok');
            } catch (e) {
              if (String(e.cause ?? e).includes('ERR_MODULE_NOT_FOUND') || String(e).includes('Cannot find package')) {
                console.error('boot smoke FAILED: missing runtime dependency');
                console.error(String(e).split('\n').slice(0, 4).join('\n'));
                process.exit(1);
              }
              console.log('boot smoke: module graph ok (runtime refused to start on env, as expected)');
            }
            process.exit(0);
          "
      # Jobs run on different runners: the tarball crosses via an
      # upload-artifact / download-artifact pair, not /tmp.
      - name: pack and upload the artifact
        run: |
          # Layout on the box after unpack (paths relative to the release dir):
          #   package.json  node_modules/  dist/server/{index.mjs,web}
          cp apps/api/package.json /tmp/tarima-pkg/package.json
          cp -a apps/api/dist/server /tmp/tarima-pkg/dist/server
          # The checkout is needed on the box only for drizzle configs;
          # keep it out of the tarball.
          rm -rf /tmp/tarima-pkg/drizzle /tmp/tarima-pkg/src /tmp/tarima-pkg/scripts /tmp/tarima-pkg/tarima.db*
          tar --zstd -cf /tmp/tarima-artifact.tar.zst -C /tmp/tarima-pkg .
          echo "artifact: $(du -h /tmp/tarima-artifact.tar.zst | cut -f1)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server
          path: /tmp/tarima-artifact.tar.zst
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: deploy to production
    needs: build
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      # The checkout is needed only to resolve the ref into a full sha
      # (the box no longer runs git). The full history is fetched so a
      # workflow_dispatch ref that is not the pushed sha resolves too.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start GitHub deployment record
        id: deployment
        uses: bobheadxi/deployments@648679e8e4915b27893bd7dbc35cb504dc915bc8 # v1.5.0
        with:
          step: start
          env: production

      - name: Download the artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: server
          path: /tmp

      - name: Connect to tailnet
        # Preferred transport: the GitHub-hosted runner joins the tailnet
        # (tag:ci) and SSHes to the VPS's MagicDNS name. Needs
        # TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET. Skipped when the secrets
        # are absent, falling back to the public-IP SSH transport.
        if: env.TS_OAUTH_CLIENT_ID != ''
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          # New peer propagation is eventually consistent on the coord
          # server, so ping until the VPS answers before the SSH.
          ping: ${{ secrets.VPS_TAILSCALE_HOST }}

      - name: Resolve the SSH host
        id: host
        env:
          TS_HOST: ${{ secrets.VPS_TAILSCALE_HOST }}
          VPS_PUBLIC_IP: ${{ vars.VPS_PUBLIC_IP }}
        run: |
          # Tailnet MagicDNS name when the OAuth secrets exist (the runner
          # joined above), otherwise the public IP from the repo variable.
          if [ -n "${TS_HOST}" ] && [ -n "${{ secrets.TS_OAUTH_CLIENT_ID }}" ]; then
            echo "host=${TS_HOST}" >> "$GITHUB_OUTPUT"
          else
            echo "host=${VPS_PUBLIC_IP:-37.187.62.157}" >> "$GITHUB_OUTPUT"
            echo "WARN: no TS_OAUTH_CLIENT_ID secret; SSHing over the public IP" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Load deploy SSH key
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_DEPLOY_SSH_KEY }}

      - name: Resolve the deployed sha
        id: ref
        env:
          DEPLOY_REF: ${{ github.event.inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          # The box does not resolve refs: CI sends the full commit sha it
          # built, so the release directory is named after the exact tree
          # that is running.
          sha="$(git rev-parse --verify "${DEPLOY_REF}^{commit}")"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "deploying ${sha}"

      - name: Ship the artifact
        env:
          SSH_HOST: ${{ steps.host.outputs.host }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "deploy@${SSH_HOST}" "cat > /tmp/tarima-artifact.tar.zst" \
            < /tmp/tarima-artifact.tar.zst
          ls -lh /tmp/tarima-artifact.tar.zst

      - name: Deploy
        id: deploy
        env:
          SSH_HOST: ${{ steps.host.outputs.host }}
          DEPLOY_SHA: ${{ steps.ref.outputs.sha }}
        shell: bash
        run: |
          # A remote non-zero exit must not fail this step: the result line
          # is parsed below so the summary and the deployment record are
          # always written, even on rollback or abort.
          set +e
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "deploy@${SSH_HOST}" \
            "sudo /usr/local/sbin/tarima-deploy '${DEPLOY_SHA}'" \
            2>&1 | tee /tmp/deploy.log
          rc=${PIPESTATUS[0]}
          set -e

          echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"

          result_line="$(grep '::DEPLOY_RESULT::' /tmp/deploy.log | tail -n1 || true)"
          status="$(printf '%s' "$result_line" | sed -n 's/.*status=\([^ ]*\).*/\1/p')"
          sha="$(printf '%s' "$result_line" | sed -n 's/.*sha=\([^ ]*\).*/\1/p')"
          prev_sha="$(printf '%s' "$result_line" | sed -n 's/.*prev_sha=\([^ ]*\).*/\1/p')"
          {
            echo "status=${status:-unknown}"
            echo "sha=${sha}"
            echo "prev_sha=${prev_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Write step summary
        if: always()
        env:
          STATUS: ${{ steps.deploy.outputs.status }}
          SHA: ${{ steps.deploy.outputs.sha }}
          PREV_SHA: ${{ steps.deploy.outputs.prev_sha }}
        run: |
          {
            echo "### deploy"
            echo
            echo "- status: ${STATUS}"
            echo "- sha: ${SHA}"
            echo "- previous: ${PREV_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update deployment record
        if: always()
        uses: bobheadxi/deployments@648679e8e4915b27893bd7dbc35cb504dc915bc8 # v1.5.0
        with:
          step: finish
          env: production
          status: ${{ steps.deploy.outputs.status == 'ok' && 'success' || 'failure' }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Fail when the deploy failed
        if: steps.deploy.outputs.status != 'ok'
        run: |
          echo "deploy status: ${{ steps.deploy.outputs.status }}" >&2
          exit 1
