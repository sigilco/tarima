[tools]
node = "24"
pnpm = "12.16.1"

[env]
# Local-only overrides live in .env.local (gitignored); see .env.example.
_.file = ".env.local"

[tasks.setup]
description = "Install deps, seed .env.local from .env.example, install git hooks"
run = """
set -euo pipefail
pnpm install
[ -f .env.local ] || cp .env.example .env.local
pnpm exec lefthook install
"""

[tasks.dev]
description = "Web dev server (vite) + channel mocks; eve runtime mounts in-process on demand"
run = "node scripts/dev.ts"

[tasks.preview]
description = "Build web + eve runtime, then serve the built app with the mocks"
run = "pnpm preview"

[tasks.mocks]
description = "Channel mocks only (telegram :3511, whatsapp :3512, mail :3513)"
run = "node apps/web/tests/channels/mock-boot.mjs 3511 3512 3513"

[tasks.doctor]
description = "Env/tooling check: vars present (never values), node/pnpm, ports, DB, provider live-vs-replay"
run = "node scripts/doctor.ts"

[tasks."db:reset"]
description = "Wipe the local dev database (.data/)"
run = "rm -rf apps/web/.data .data"

[tasks.validate]
description = "Full gate: typecheck + lint + format + tests + knip"
run = "pnpm validate"

[tasks."validate:quick"]
description = "Quick static gate (~10s): typecheck + lint + format, no tests/knip"
run = "pnpm validate --quick"

[tasks."verify:smoke"]
description = "Boot the preview build with stub LLM + mocks on a temp DB and assert the wire paths"
run = "node scripts/smoke.ts"

[tasks."test:e2e"]
description = "Playwright browser suite (on demand / nightly)"
run = "pnpm --filter web test:e2e"

[tasks."eval:offline"]
description = "Replay golden Berkeley venue queries against recorded fixtures (no network)"
run = "pnpm --filter @tarima/api exec tsx scripts/eval-offline.ts"

[tasks.build]
description = "Build the web app (dist/) and the eve runtime (.output/)"
run = "turbo run build build:eve"

[tasks."build:web"]
description = "Build only the web app; output lands in apps/web/dist"
run = "turbo run build"

[tasks."deploy:lint"]
description = "mypy --strict the Python deploy runner + shellcheck install-host.sh"
run = """
set -euo pipefail
# mypy is not a project dependency; run it through uvx so the task
# works without a virtualenv. uv is required tooling on this machine.
uvx mypy --strict deploy/scripts/tarima-deploy.py deploy/tests/test_tarima_deploy.py
shellcheck deploy/scripts/install-host.sh
"""

[tasks."deploy:test"]
description = "Run the host-side deploy script tests against a temp root"
run = "python3 -m unittest discover deploy/tests"

[tasks."deploy:dry"]
description = "Dry-run the host-side deploy script against a temp root with a synthetic artifact"
run = """
set -euo pipefail
root="$(mktemp -d)"
trap 'rm -rf "$root"' EXIT
mkdir -p "$root/pkg/dist/server/web/ssr" "$root/pkg/dist/server/web/client" "$root/pkg/node_modules"
echo "export const ok = 1;" > "$root/pkg/dist/server/index.mjs"
echo "ssr" > "$root/pkg/dist/server/web/ssr/server.js"
echo "client" > "$root/pkg/dist/server/web/client/index.html"
echo '{"name":"@tarima/api"}' > "$root/pkg/package.json"
tar --zstd -cf "$root/artifact.tar.zst" -C "$root/pkg" .
APP_ROOT="$root/app_root" \
SHARED_DIR="$root/shared" \
RELEASES_DIR="$root/releases" \
CURRENT_LINK="$root/app_root/current" \
STATE_FILE="$root/shared/deployed-sha" \
LOCK_FILE="$root/app_root/.tarima-deploy.lock" \
ARTIFACT_TAR="$root/artifact.tar.zst" \
UNIT=tarima.service \
SERVICE="$(id -un)" \
HEALTH_CMD=true \
HEALTH_ATTEMPTS=1 \
HEALTH_INTERVAL=0 \
DRY_RUN=1 \
  python3 deploy/scripts/tarima-deploy.py "$(git rev-parse --short HEAD)"
"""
