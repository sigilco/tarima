[tools]
node = "24"
pnpm = "11.21.0"

[tasks.validate]
description = "Full gate: typecheck + lint + format + tests + knip"
run = "pnpm validate"

[tasks."validate:quick"]
description = "Quick static gate (~10s): typecheck + lint + format, no tests/knip"
run = "pnpm validate --quick"

[tasks.dev]
description = "Run web + api dev servers"
run = "pnpm dev"

[tasks.build]
description = "Build the web (incl. the prerendered landing in apps/web/dist/client) and the api artifact (apps/api/dist/server)"
run = "pnpm build"

[tasks."build:web"]
description = "Build only the web app; output lands in apps/web/dist/client (Pages) and apps/web/dist/ssr"
run = "pnpm --filter web build"

[tasks."build:api"]
description = "Build only the api artifact; output lands in apps/api/dist/server"
run = "pnpm --filter @tarima/api build"
