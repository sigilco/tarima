packages:
  - apps/*
  - packages/*

# Toolchain version catalog. Workspace packages reference these via
# `catalog:` in package.json so versions stay single-sourced (brioso pattern).
catalogs:
  default:
    typescript: "6.0.3"
    oxlint: "1.88.0"
    oxfmt: "^0.73.0"
    vitest: "^4.0.14"
    knip: "^5.72.0"
    valibot: "^1.2.0"
    "@logtape/logtape": "^2.1.0"
    "@logtape/file": "^2.1.0"

# allowBuilds (pnpm 11+): approve install-time build scripts pnpm blocks by
# default. lefthook must build to install git hooks on `pnpm install`.
allowBuilds:
  lefthook: true
  better-sqlite3: true
  esbuild: true
