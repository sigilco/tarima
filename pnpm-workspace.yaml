packages:
  - apps/*
  - packages/*
  - tests/*

catalog:
  typescript: ^5.9.3
  vitest: ^3.2.7
  "@types/node": ^24
  valibot: ^1.1.0
  "@logtape/logtape": ^1.2.0
  "@logtape/file": ^1.2.0
  "node-html-parser": ^9.0.5
  "postal-mime": ^4.0.11
  grammy: ^1.46.0
  papaparse: ^5.7.0

allowBuilds:
  lefthook: true
  better-sqlite3: true
  esbuild: true
  workerd: true

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - lightningcss
dangerouslyAllowAllBuilds: true

# One node type version everywhere. @types/papaparse declares
# "@types/node: *", which resolved to 22 while vitest and the catalog sit on
# 24: both copies then loaded into one program (venuesearch typecheck) and
# each declared a different global Response out of its own undici-types.
overrides:
  "@types/node": ^24.19.2
